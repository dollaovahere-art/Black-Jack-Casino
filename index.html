<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Casino 6-Player Live Blackjack</title>
    <style>
        body { font-family: sans-serif; background-color: #0b3319; color: white; text-align: center; margin: 0; padding: 5px; }
        h1 { color: #ffd700; margin: 5px 0; font-size: 1.4rem; }
        .casino-table { max-width: 1000px; margin: 0 auto; background: radial-gradient(circle, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0.6) 100%); padding: 10px; border-radius: 20px; border: 4px solid #ffd700; box-shadow: inset 0 0 20px #000; }
        .dealer-section { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px dashed rgba(255,215,0,0.3); }
        .players-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .player-box { background: rgba(0,0,0,0.4); padding: 8px; border-radius: 12px; border: 2px solid #555; width: calc(46% - 10px); min-width: 140px; max-width: 180px; min-height: 150px; box-sizing: border-box; transition: all 0.25s ease; }
        @media (min-width: 600px) { .player-box { width: calc(33.33% - 12px); } }
        .player-box.active-turn { border-color: #ffd700; background: rgba(255,215,0,0.1); box-shadow: 0 0 12px #ffd700; }
        .player-box.empty-seat { border: 2px dashed #444; background: none; opacity: 0.4; }
        .name-label { font-weight: bold; color: #ffd700; font-size: 1rem; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .hand-title { font-size: 0.85rem; color: #bbb; margin: 2px 0; }
        .player-stats { font-size: 0.8rem; margin-bottom: 4px; color: #fff; }
        .cards-container { display: flex; justify-content: center; gap: 3px; min-height: 70px; margin-top: 3px; flex-wrap: wrap; }
        .card { background: white; color: black; width: 42px; height: 64px; border-radius: 5px; display: flex; flex-direction: column; justify-content: space-between; padding: 3px; box-sizing: border-box; font-size: 0.9rem; font-weight: bold; box-shadow: 1px 1px 4px rgba(0,0,0,0.5); }
        .card .suit-center { font-size: 1.2rem; align-self: center; margin-top: -3px; }
        .card .corner-bottom { transform: rotate(180deg); }
        .red { color: #d12c2c; }
        .hidden-card { background: linear-gradient(135deg, #7f8c8d 25%, #2c3e50 25%, #2c3e50 50%, #7f8c8d 50%, #2c3e50 100%); background-size: 6px 8px; border: 1px solid white; }
        .dashboard { background: rgba(0,0,0,0.6); padding: 10px; border-radius: 12px; }
        #status-message { font-size: 1rem; margin-bottom: 10px; min-height: 20px; color: #ffd700; font-weight: bold; }
        .btn-group { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
        button { background: #ffd700; color: #0b3319; border: none; padding: 6px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        button:disabled { background: #444; color: #222; cursor: not-allowed; }
        .join-panel { margin-bottom: 10px; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 8px; display: inline-block; border: 1px solid #ffd700; }
        .join-input { padding: 5px; border-radius: 4px; border: none; font-weight: bold; text-align: center; font-size: 0.85rem; width: 120px; }
        .bet-btn { background: #2da15f; color: white; }
        .all-in-btn { background: #d4ac0d; color: black; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <h1>Grand Casino 6-Player Blackjack</h1>
    
    <div class="join-panel" id="join-panel">
        <input type="text" id="username-input" class="join-input" placeholder="Your Name">
        <button onclick="joinGame()">Sit Down 🪑</button>
    </div>

    <div class="casino-table">
        <div class="dealer-section">
            <div class="name-label">Dealer</div>
            <div class="hand-title" id="dealer-title">Dealer: ?</div>
            <div class="cards-container" id="dealer-cards"></div>
        </div>
        
        <div class="players-grid" id="players-grid"></div>

        <div class="dashboard">
            <div id="status-message">Please enter your name above to claim a seat!</div>
            <div class="btn-group">
                <button class="bet-btn" id="bet-10-btn" onclick="sendBet(10)" disabled>Bet +$10 💵</button>
                <button class="all-in-btn" id="all-in-btn" onclick="sendBet('all')" disabled>All-In 💰</button>
            </div>
            <div class="btn-group">
                <button id="deal-btn" onclick="sendDeal()" disabled>Deal Cards 🃏</button>
                <button id="hit-btn" onclick="sendAction('hit')" disabled>Hit ＋</button>
                <button id="double-btn" onclick="sendAction('double')" disabled>Double Down 💰</button>
                <button id="stand-btn" onclick="sendAction('stand')" disabled>Stand ✋</button>
            </div>
            
            <div style="margin-top: 15px; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 8px; text-align: left;">
                <div id="chat-messages" style="height: 100px; overflow-y: auto; font-size: 0.85rem; padding: 5px; margin-bottom: 5px; background: rgba(0,0,0,0.3); border-radius: 4px; color: #bbb;"></div>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="chat-input" style="flex-grow: 1; padding: 5px; border-radius: 4px; border: none; font-size: 0.85rem;" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()" style="padding: 5px 10px;">Send 💬</button>
                </div>
            </div>
        </div>
    </div>
    <script src="client.js"></script>
</body>
</html>
